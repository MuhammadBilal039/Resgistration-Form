<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body onload="loadDashboard()">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="#">To-Do App</a>
    <div class="ms-auto text-white" id="userEmailDisplay"></div>
    <button class="btn btn-danger ms-3" onclick="logout()">Logout</button>
  </nav>

  <div class="container mt-5">
    <h3 class="text-center mb-4">Your To-Do List</h3>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <input type="text" id="todoInput" class="form-control mb-2" placeholder="Enter task" />
        <button class="btn btn-primary w-100 mb-3" onclick="addTodo()">Add Task</button>
        <ul class="list-group" id="todoList"></ul>
      </div>
    </div>
  </div>

  <script>
    let currentUser;

    function loadDashboard() {
      currentUser = JSON.parse(localStorage.getItem("currentUser"));
      if (!currentUser) {
        window.location.href = "login.html";
        return;
      }

      document.getElementById("userEmailDisplay").textContent = currentUser.email;
      loadTodos();
    }

    function addTodo() {
      const task = document.getElementById("todoInput").value.trim();
      if (!task) return;

      const email = currentUser.email;
      let allTodos = JSON.parse(localStorage.getItem("todos")) || {};
      if (!allTodos[email]) allTodos[email] = [];
      allTodos[email].push(task);

      localStorage.setItem("todos", JSON.stringify(allTodos));
      document.getElementById("todoInput").value = "";
      loadTodos();
    }

    function loadTodos() {
      const email = currentUser.email;
      const allTodos = JSON.parse(localStorage.getItem("todos")) || {};
      const todos = allTodos[email] || [];

      const list = document.getElementById("todoList");
      list.innerHTML = "";

      todos.forEach((todo, index) => {
        const li = document.createElement("li");
        li.className = "list-group-item d-flex justify-content-between";
        li.innerHTML = `
          ${todo}
          <button class="btn btn-sm btn-danger" onclick="deleteTodo(${index})">Delete</button>
        `;
        list.appendChild(li);
      });
    }

    function deleteTodo(index) {
      const email = currentUser.email;
      let allTodos = JSON.parse(localStorage.getItem("todos")) || {};
      allTodos[email].splice(index, 1);
      localStorage.setItem("todos", JSON.stringify(allTodos));
      loadTodos();
    }

    function logout() {
      localStorage.removeItem("currentUser");
      window.location.href = "loginForm.html";
    }
  </script>
</body>
</html>
