<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
  <div class="container">
    <h2 class="text-center">Registeration Form</h2>
    <form id="registrationForm" class="w-50 mx-auto mt-4">
      <input type="text" id="fullName" class="form-control mb-3" placeholder="Full Name" required />
      <input type="email" id="email" class="form-control mb-3" placeholder="Email" required />
      <input type="password" id="password" class="form-control mb-3" placeholder="Password" required />
      <button type="submit" class="btn btn-primary w-100 mb-3">Register Now</button>
      <p>Already have an account? <a href="loginForm.html">Login</a></p>

    </form>
  </div>

  <script>
    document.getElementById("registrationForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const fullName = document.getElementById("fullName").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const user = { fullName, email, password };
      let users = JSON.parse(localStorage.getItem("users")) || [];
      users.push(user);
      localStorage.setItem("users", JSON.stringify(users));
      alert("Registration successful!");
      window.location.href = "loginForm.html";
    });
  </script>
</body>
</html>
