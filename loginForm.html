<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
  <div class="container">
    <h2 class="text-center">Login</h2>
    <form id="loginForm" class="w-50 mx-auto mt-4">
      <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Email" required />
      <input type="password" id="loginPassword" class="form-control mb-3" placeholder="Password" required />
      <button type="submit" class="btn btn-success w-100 mb-3">Login</button>
      <p>If you have not an account? Please <a href="registrationForm.html">Register</a></p>
    </form>
    <div id="message" class="text-center text-danger mt-3"></div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      const users = JSON.parse(localStorage.getItem("users")) || [];
      const user = users.find(u => u.email === email && u.password === password);

      if (user) {
        localStorage.setItem("currentUser", JSON.stringify(user));
        window.location.href = "index.html";
      } else {
        document.getElementById("message").textContent = "Invalid credentials!";
      }
    });
  </script>
</body>
</html>
